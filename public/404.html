<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found — Eclipse Mapper</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='11' fill='%23fbbf24'/><circle cx='11' cy='14' r='11' fill='%230f172a'/></svg>">
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh;
    display: grid; place-items: center;
    background: #f8fafc; color: #0f172a;
    font: 400 1rem/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 1.5rem;
  }
  main { max-width: 28rem; text-align: center; }
  h1 { font-size: 1.15rem; margin: 0 0 .5rem; }
  p { margin: 0 0 1.25rem; font-size: .88rem; color: #475569; }
  a {
    display: inline-block; padding: .5rem 1rem; border-radius: 8px;
    background: #4c1d95; color: #fff; text-decoration: none; font-size: .88rem; font-weight: 600;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #0b1120; color: #f8fafc; }
    p { color: #94a3b8; }
    a { background: #a78bfa; color: #0b1120; }
  }
</style>
</head>
<body>
<main>
  <h1>There is nothing at this address</h1>
  <p>Whatever was here has moved or never was. The map has every eclipse.</p>
  <a href="/">Open the map</a>
</main>
<script>
// If the missing page is an eclipse's own address -- which happens if a
// deployment ships short -- the map can still show that eclipse from its query
// form. Send the visitor there rather than leaving them at a dead end.
(function () {
  var m = location.pathname.match(/^\/eclipse\/(\d{4})-(\d{2})-(\d{2})\/?$/);
  if (m) location.replace('/?e=' + m[1] + m[2] + m[3]);
})();
</script>
</body>
</html>
