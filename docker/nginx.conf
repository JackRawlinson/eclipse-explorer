# Static hosting for Eclipse Mapper.  Nothing is generated at runtime: the whole
# site, data included, is baked into the image at build time.

server {
    listen       80;
    listen       [::]:80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # GeoJSON compresses about four to one, and the vendored map library is
    # half a megabyte of JavaScript.  Worth turning on.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types        application/json application/geo+json application/javascript
                      text/javascript text/css image/svg+xml;
    # (PNG shading images are already compressed; nginx leaves them alone.)

    add_header X-Content-Type-Options "nosniff" always;

    # nginx's mime.types has no entry for .mjs, and a browser will refuse to
    # execute an ES module served as application/octet-stream -- doubly so with
    # nosniff set. The vendored map library is a .mjs, so this is load-bearing.
    location ~* \.mjs$ {
        default_type text/javascript;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # The index names the current build, so it must never be served from cache.
    location = /data/index.json {
        default_type application/json;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Per-eclipse data is requested with the build stamp in the query string, so
    # it can be cached hard: a rebuild changes the URL.
    location ~* ^/data/.+\.(geojson|png)$ {
        default_type application/geo+json;      # .geojson is not in mime.types
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # The app shell is small; revalidate it so a redeploy is picked up at once.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri $uri/ =404;
    }
}
