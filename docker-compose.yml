# docker compose up -d --build
#
# Any Docker host will do. unraid-template.xml is there for that platform's
# own container UI, which wants a template rather than a compose file.

services:
  eclipse-mapper:
    build:
      context: .
      args:
        # Narrow these to cut the image build down from ~11 minutes.
        YEAR_MIN: "1900"
        YEAR_MAX: "2100"
    image: eclipse-mapper:latest
    container_name: eclipse-mapper
    ports:
      - "8080:80"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
